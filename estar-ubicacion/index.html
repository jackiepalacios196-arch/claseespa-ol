function dialogs(){let h=`<div class="c"><p class="ins"><b>Completa los diálogos con ser y estar.</b> Elige la opción en cada espacio y toca Comprobar.<br><span class="en">Complete the dialogues with ser and estar. Choose the option in each blank and tap Check.</span></p></div>`;
DG.forEach(([t,em,c,ce,L],d)=>{h+=`<div class="c d" id="dg${d}"><b>${t}</b><div style="font-size:2.4rem">${em}</div><p>${c}<br><span class="en">${ce}</span></p>`+L.map(([w,tx,en])=>`<p><b>${w}:</b> ${tx.replace(/\{(.+?)\}/g,(m,a)=>{const o=a.split('|');return `<select data-a="${o[0]}"><option value="">…</option>${sh([...o]).map(x=>`<option>${x}</option>`).join('')}</select>`})}<br><span class="en">${en}</span></p>`).join('')+`<button class="b" onclick="chk(${d})">Comprobar / Check</button> <button class="b" onclick="hear(${d})">🔊 Escuchar</button><div class="sc" id="dr${d}"></div></div>`});$('#app').innerHTML=h}
function chk(d){let ok=0,n=0;document.querySelectorAll('#dg'+d+' select').forEach(x=>{n++;const r=x.value==x.dataset.a;x.className=r?'ok':'no';if(r)ok++});$('#dr'+d).textContent=`${ok} / ${n} ${ok==n?'🎉 ¡Excelente!':'— corrige los rojos / fix the red ones'}`}
function hear(d){say(DG[d][4].map(l=>l[1].replace(/\{([^}|]+)[^}]*\}/g,'$1')).join(' '))}
function nav(){$('#nav').innerHTML=SEC.map((s,i)=>`<button class="${i==cur?'on':''}" onclick="go(${i})">${s}</button>`).join('')}
function go(i){cur=i;nav();[plan,warm,rules,quizSE,quizIM,dialogs,conv][i]();scrollTo(0,0)}
function sc(k,n){return `<div class="sc" id="sc${k}">Puntos / Score: ${score[k]||0} / ${n}</div>`}
function rules(){$('#app').innerHTML=`${vocab()}<div class="c"><b>ESTAR = ¿Dónde? / ¿Cómo estás?</b><p class="en">Use estar for location and for how someone feels (state).</p>
<table><tr><th>yo</th><td><b>estoy</b></td><th>nosotros</th><td><b>estamos</b></td></tr><tr><th>tú</th><td><b>estás</b></td><th>ustedes</th><td><b>están</b></td></tr><tr><th>él/ella/usted</th><td><b>está</b></td><th>ellos/ellas</th><td><b>están</b></td></tr></table></div>
<div class="c"><b>SER vs. ESTAR</b><table><tr><th>SER</th><th>ESTAR</th></tr>
<tr><td>Origen: <i>Soy de Canadá.</i><br><span class="en">origin</span></td><td>Ubicación: <i>Estoy en Cusco.</i><br><span class="en">location</span></td></tr>
<tr><td>Descripción: <i>Lima es grande.</i><br><span class="en">description</span></td><td>Estado: <i>Estoy cansado.</i><br><span class="en">feeling / state</span></td></tr>
<tr><td>Identidad: <i>Es un museo.</i><br><span class="en">identity</span></td><td>Lugar: <i>El museo está en Barranco.</i><br><span class="en">where it is</span></td></tr>
<tr><td>¿De dónde eres? ¿Cómo es?</td><td>¿Dónde estás? ¿Cómo estás?</td></tr></table>
<p class="en">Easy rule: What is it / what is it like? → ser. Where is it / how is it now? → estar.</p></div>

<button class="b" onclick="go(3)">Practicar →</button>`}
function quiz(k,items,head,ins){score[k]=0;let h=`<div class="c"><p class="ins">${ins}</p></div>`+head+sc(k,items.length);
items.forEach((it,i)=>{const[svg,q,a,en,o]=k=='im'?it:[null,...it];
h+=`<div class="c" id="${k}${i}">${ctx(k,i)}${svg?`<svg viewBox="0 0 260 130">${svg}</svg>`:''}<p class="q">${q.replace('___','<span class="bl">&nbsp;</span>')} ${k=='se'||k=='im'?sp(q.replace('___','…')):''}</p><div class="o">${o.split('/').map(x=>`<button onclick="pick('${k}',${i},this,'${a}',${items.length})">${x}</button>`).join('')}</div><div class="fb"></div></div>`});
$('#app').innerHTML=h}
function pick(k,i,b,a,n){const c=$('#'+k+i);if(c.dataset.done)return;const it=M[k][i];const en=k=='im'?it[3]:it[2];
if(k=='sit'||k=='loc')say(b.textContent);if(b.textContent==a){b.classList.add('ok');c.dataset.done=1;if(k=='se'||k=='im')say(it[k=='im'?1:0].replace('___',a));const bl=c.querySelector('.bl');if(bl)bl.textContent=a;
if(!c.dataset.err){score[k]++;$('#sc'+k).textContent=`Puntos / Score: ${score[k]} / ${n}`}
c.querySelector('.fb').innerHTML=`✅ <span class="en">${en}</span>`}
else{b.classList.add('no');c.dataset.err=1;c.querySelector('.fb').textContent='❌ Intenta otra vez / Try again'}}
function quizSE(){quiz('se',SE,'','<b>Completa con ser o estar.</b> Mira la pregunta y elige la forma correcta.<br><span class="en">Complete with ser or estar. Read the sentence and choose the correct form.</span>')}
function quizIM(){quiz('im',IM,'','<b>Mira la imagen y completa.</b><br><span class="en">Look at the picture and complete the sentence.</span>')}
go(0);
</script></body></html>
